# full pipeline on the fruit_hand data set, whole-hand container.
#
#   ./cpu_pack ../cpu_pack/configs/pack_hand.cfg

# ---- data locations ----
dataDir             F:/meshes/fruit_hand/
fruitSubdir         fruits_1
containerFile       hands/hand4.8m.stl
innerContainerFile  hands/hand4.8m_inner12cm.obj
exclusionMeshFile   hands/hand4.8m_exclude.obj
outSubdir           out_hand_medium_subgrid_debug

# ---- resolutions, in cm ----
dx                  0.3
containerSDFDx      2.0
broadPhaseDx        2.0
gridDx              0.5
subgridCellSize     20.0

# ---- search effort ----
maxTrialCount       10

# ---- where to start ----
startStep           3
endStep             4
startItem           0

# ---- resume ----
resume              1
resumePackFile      F:/meshes/fruit_hand/pack_step3_filtered.txt

# ---- checkpoints ----
trajSaveInterval    10
packSaveInterval    20

# ---- misc ----
computeStats        0
maxSecondsPerStep   1






