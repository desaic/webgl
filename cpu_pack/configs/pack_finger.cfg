# full pipeline on the fruit_hand data set, finger container only.
# see pack_hand.cfg (planned) for the whole-hand container.
#
#   ./cpu_pack ../cpu_pack/configs/pack_finger.cfg
#
# format is one "key value" per line. # starts a comment. the value is the
# rest of the line, so paths may contain spaces. unknown keys are reported
# and skipped. anything left out keeps the default in PackingConfig.h.

# ---- data locations ----
# everything below is relative to dataDir.
dataDir             F:/meshes/fruit_hand/
fruitSubdir         fruits_1
containerFile       hands/finger4.8m.stl
innerContainerFile  hands/finger_4.8m_inner.stl
outSubdir           out

# ---- resolutions, in cm ----
# packing occupancy grid. the FFT spot search runs at this resolution, so it
# sets both the placement precision and most of the search cost. a 1 cm berry
# is only 3 voxels across at 0.3.
dx                  0.3
# container sdf. coarse on purpose, it only guides the push direction.
containerSDFDx      2.0
# broad phase cell size.
broadPhaseDx        2.0
# narrow phase collision grid cell size. dominant term in settle time,
# because a contact query tests every triangle in the cells it touches.
# measured on the 6k berry case: 1.0 -> 124 ms per placement, 0.5 -> 67,
# 0.25 -> 57 but with 400 MB of grids. 0.5 is the knee.
gridDx              0.5
# small items search one 20 cm cell at a time instead of the whole
# container. with the measured container this is a 10x3x3 = 90 cell walk.
subgridCellSize     20.0

# ---- search effort ----
# random rotations tried per item per cell before the cell is retired.
maxTrialCount       10

# ---- where to start ----
# PlanPackingSteps emits 6 steps for this data set now that the small-fruit
# (6-3cm) bulk step is removed (PackingPlan.cpp): 4 bulk placement steps,
# then 2 crevice-fill steps appended at the end (StepKind::Crevice -- see
# plan.txt PIPELINE Phase 2). The medium group is used twice, once as a seed:
#   0  medium large kinds (20-10cm), only 20 placements, hard force to the left
#   1  large kinds (>20cm), outwards, full container FFT search
#   2  medium large kinds (20-10cm), outwards
#   3  medium kinds (10-6cm), outwards, shrinkwrap-surface targeting
#      (radius 3cm, voxel 1cm -- nestles onto steps 1-2's placed fruit
#      instead of just the container wall, see PackingStep::
#      useShrinkwrapSurfacePoints)
#   4  crevice fill, groups[size-2] (6-3cm)
#   5  crevice fill, groups.back() (<=3cm)
# both indices below are clamped to the nearest valid value, so 99 means
# "the last one" and there is no way to make them out of range.
#
# deep-diving step 3 specifically: resume from the pack already sitting
# right before it (steps 0-2 done), run only step 3.
startStep           0
# one past the last step to run (default: run to the end of the plan).
endStep             3
# first kind within each step. leave at 0 unless resuming a step that died
# partway through a known kind.
startItem           0

# ---- resume ----
# start from an existing pack file instead of an empty container. the path is
# relative to dataDir. set resume to 0 for a run from scratch.
resume              1
resumePackFile      pack_final_finger_step3.txt

# ---- checkpoints ----
# rewrite progress every N placements, rotating over 10 files. 0 disables.
# each save rewrites the whole accumulated state, so at thousands of
# instances these get expensive. raise them for a long run.
trajSaveInterval    10
packSaveInterval    20

# ---- misc ----
# rescan the mesh directory and rewrite stats.txt before planning. only
# needed after the mesh set changes, and it costs a full pass over 95
# meshes, so 0 is right for repeat runs.
computeStats        0
# abandon a step after this many seconds, even if step.count has not been
# reached and kinds have not all retired -- now actually enforced
# (PackingConfig.h/PackingDriver.cpp), previously an unrecognized key that
# silently did nothing. 0 means no limit. A LARGE_INT ("pack until it stops
# fitting") step has no other bound: with less placed by an earlier step
# than expected, one still-fitting elongated kind can keep succeeding via
# the full-container FFT search for a very long time before it finally,
# naturally exhausts (measured: over 12 hours before being killed by hand).
# 300 s is a generous cap while iterating on this container/plan.
maxSecondsPerStep   300
