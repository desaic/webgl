# stage 2: resume stage 1's melon (a handful of plum1/fig2/strawberry2
# already placed) and run only the fillSurface step, filling gaps with
# blueberries. fruitSubdir here has both the big fruit and the
# blueberries, so PlanPackingSteps' last group (<=3 cm) is the 4
# blueberry kinds; startStep 99 clamps to that last step, skipping the
# big-fruit steps entirely (they already ran in stage 1, and resuming
# would otherwise try to place more of them into the same container).
#
#   ./cpu_pack ../cpu_pack/pack_melone_test.cfg            (stage 1, first)
#   ./cpu_pack ../cpu_pack/pack_melone_test_stage2.cfg      (this file)

dataDir             /media/desaic/WD/meshes/fruit_hand/
fruitSubdir         fruits_blueberry_test
containerFile       fruits_1/melone_two.obj
innerContainerFile  hands/finger_4.8m_inner.stl
outSubdir           out_melone_test

dx                  0.3
containerSDFDx      2.0
broadPhaseDx        2.0
gridDx              0.5
subgridCellSize     20.0

maxTrialCount       10

startStep           99
startItem           0

resume              1
# stage 1's last periodic save (17 of 17 placed, checked after the run).
resumePackFile      out_melone_test/pack8.txt

trajSaveInterval    0
packSaveInterval    1

# fruits_blueberry_test also has the big-fruit meshes, unchanged since
# stage 1 -- stats.txt does not need to be regenerated, but it is cheap
# and this avoids a stale-stats footgun if the mesh set ever changes.
computeStats        1
# first pass: bound it just to see the mechanism work. raise to 0 (no
# limit) for a real fill-to-completion run.
maxSecondsPerStep   120

surfaceRaySpacing   0.5
patchSize           2.0
holeDepth           1.0
deepPocketThreshold 1.5
maxProbeDepth       8.0
patchMaxFails       20
pocketTrialCount    8
