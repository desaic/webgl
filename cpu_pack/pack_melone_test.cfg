# small, fast dev/validation loop, stage 1: seed melone_two (a single
# ~14 cm melon mesh, reused as a container) with a handful of medium fruit
# (plum1, fig2, strawberry2 -- all 4-5.5 cm) via the normal outward FFT
# search, same as the real pipeline's medium-fruit steps. Bounded to a few
# seconds so it places "a couple," not a full fill -- the point is to give
# stage 2's blueberries real, dispersed material to nest against, closer
# to the real hand pack's conditions than starting from a totally empty
# container (which hid a real bug -- see heuristic_plan.md).
#
#   ./cpu_pack ../cpu_pack/pack_melone_test.cfg
#   ./cpu_pack ../cpu_pack/pack_melone_test_stage2.cfg   (resumes this stage's output)

dataDir             /media/desaic/WD/meshes/fruit_hand/
fruitSubdir         fruits_melone_bigonly
containerFile       fruits_1/melone_two.obj
innerContainerFile  hands/finger_4.8m_inner.stl
outSubdir           out_melone_test

dx                  0.3
containerSDFDx      2.0
broadPhaseDx        2.0
gridDx              0.5
subgridCellSize     20.0

maxTrialCount       10

# run every step from scratch, empty container. PlanPackingSteps puts
# plum1/fig2/strawberry2 (4-5.5 cm) in the 3-6 cm group (step index 2,
# outward FFT search) and the 4 blueberries (<=3 cm) in the last group
# (step index 4, fillSurface) -- stopped here before that last step runs.
startStep           0
startItem           0

resume              0
resumePackFile      pack_melone_test.txt

trajSaveInterval    0
packSaveInterval    1

# the fruit dir changed, so stats.txt must match it.
computeStats        1
# bounds every step uniformly, so this also bounds step 2 (the medium
# fruit outward search) -- a few seconds is plenty for "a handful," not a
# full fill. Stage 2 uses its own, longer bound for the blueberry step.
maxSecondsPerStep   15

surfaceRaySpacing   0.5
patchSize           2.0
holeDepth           1.0
deepPocketThreshold 1.5
maxProbeDepth       8.0
patchMaxFails       6
pocketTrialCount    3
